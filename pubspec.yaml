name: allplant
description: "An easy to use plant care app"
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.8.0-24.0.dev

dependencies:

  flutter:
    sdk: flutter


  # State Management
  bloc: ^9.0.0
  flutter_bloc: ^9.0.0

  # UI 
  cupertino_icons: ^1.0.8



  # Routing
  go_router: ^14.8.1

  # Database & Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  hive_generator: ^2.0.1

  # File System Access
  path_provider: ^2.1.0


  table_calendar: ^3.2.0

  # google
  build_runner: ^2.4.15
  equatable: ^2.0.7
  flutter_lints: ^5.0.0
  flutter_screenutil: ^5.9.3
  image_picker: ^1.1.2
  intl: ^0.20.2
  very_good_analysis: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
 

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/

  fonts:
    - family: Montserrat
      fonts:
        - asset: fonts/Montserrat-MediumItalic.ttf
    - family: ProtestRevolution
      fonts:
        - asset: fonts/ProtestRevolution-Regular.ttf
